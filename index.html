function completed(){return DATA.questions.filter(q=>fields.filter(f=>f.q===q.id).every(f=>f.kind==="file"?!!state.photos[f.key]:!!value(f.key).length)).length}
function intro(){
 app.innerHTML='<section class="intro"><div class="intro-heading"><div class="eyebrow">◷ 25–35 МИНУТ</div><h1>ДИАГНОСТИКА<br><span>МЕНТОРСТВО</span></h1><p class="subtitle">'+esc(DATA.intro[1])+'</p><p class="spheres">'+esc(DATA.intro[2])+'</p></div><section class="intro-note"><h2>'+esc(DATA.intro[3])+'</h2><p>'+esc(DATA.intro.slice(4,7).join(" "))+'</p><p>'+esc(DATA.intro.slice(7,9).join(" "))+'</p><p>'+esc(DATA.intro.slice(9,11).join(" "))+'</p><p>'+esc(DATA.intro[11])+'</p></section><div class="intro-start"><label class="field-label" for="name">ФИО</label><input id="name" autocomplete="name" value="'+esc(state.name)+'"><div id="error"></div><button class="button start" id="start">Начать анкету <span>→</span></button></div></section>';
 document.getElementById("name").addEventListener("input",e=>state.name=e.target.value);
 document.getElementById("start").addEventListener("click",()=>{if(!state.name.trim())return showError("Укажи ФИО, чтобы мы могли найти твою анкету.");state.step=0;render();});
}
function form(){
 const qs=DATA.questions.filter(q=>q.block===state.step),done=completed();
 app.innerHTML='<main class="form"><div class="section-strip"><span>Раздел '+(state.step+1)+' из 7</span><span>'+done+' / 46 вопросов заполнено</span></div><div class="progress"><span style="width:'+(done/46*100)+'%"></span></div><nav class="block-nav">'+DATA.blocks.map((b,i)=>'<button data-step="'+i+'" class="'+(i===state.step?"active":"")+'">'+(i<6?"Блок "+i:"Финал")+'</button>').join("")+'</nav><h1 class="block-title">'+esc(DATA.blocks[state.step])+'</h1>'+qs.map(q=>'<section class="question"><h2>'+esc(q.title)+'</h2>'+(q.description?'<p class="description">'+esc(q.description)+'</p>':"")+(q.id===5?'<a class="instruction" target="_blank" rel="noreferrer" href="https://disk.yandex.ru/d/IEmM8RgVwHbLzQ">Как делать замеры</a>':"")+'<p class="answer-type">'+esc(q.answerType)+'</p>'+fields.filter(f=>f.q===q.id).map(f=>(q.id===5&&f.key==="q5_3"?'<a class="instruction" target="_blank" rel="noreferrer" href="https://disk.yandex.ru/d/k2aWVYoHOmBOZw">Как фотографировать себя</a>':"")+control(f)).join("")+'</section>').join("")+'<div id="error"></div><footer class="form-footer"><button class="button secondary" id="back">← Назад</button>'+(state.step<6?'<button class="button" id="next">Следующий блок →</button>':'<button class="button" id="send">Отправить анкету →</button>')+'</footer></main>';
 app.querySelectorAll("[data-step]").forEach(x=>x.addEventListener("click",()=>{state.step=Number(x.dataset.step);render()}));
 app.querySelectorAll("[data-key]").forEach(x=>x.addEventListener("change",e=>{const key=e.target.dataset.key,field=fields.find(f=>f.key===key);if(field.kind==="multi"){const list=Array.isArray(value(key))?value(key):[];state.answers[key]=e.target.checked?[...list,e.target.value]:list.filter(v=>v!==e.target.value);form()}else state.answers[key]=e.target.value}));
 app.querySelectorAll("textarea[data-key],input[data-key]:not([type=radio]):not([type=checkbox])").forEach(x=>x.addEventListener("input",e=>state.answers[e.target.dataset.key]=e.target.value));
 app.querySelectorAll("[data-file]").forEach(x=>x.addEventListener("change",e=>{const file=e.target.files&&e.target.files[0];if(file&&file.size>8*1024*1024){e.target.value="";return showError("Размер одного фото не должен превышать 8 МБ.")}if(file)state.photos[e.target.dataset.file]=file;else delete state.photos[e.target.dataset.file];form()}));
 document.getElementById("back").addEventListener("click",()=>{state.step--;render()});
 const next=document.getElementById("next");if(next)next.addEventListener("click",()=>{state.step++;render()});
 const send=document.getElementById("send");if(send)send.addEventListener("click",submit);
}
function showError(message){const box=document.getElementById("error");if(box)box.innerHTML='<p class="error" role="alert">'+esc(message)+'</p>'}
async function preview(file){const url=URL.createObjectURL(file);try{const img=await new Promise((resolve,reject)=>{const x=new Image();x.onload=()=>resolve(x);x.onerror=()=>reject(new Error("Не удалось прочитать фото. Выбери другой файл."));x.src=url});const max=900,ratio=Math.min(1,max/img.naturalWidth,max/img.naturalHeight),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",.78));if(!blob)throw new Error("Не удалось подготовить фото.");return new File([blob],file.name.replace(/\.[^.]+$/,"")+"-preview.jpg",{type:"image/jpeg"})}finally{URL.revokeObjectURL(url)}}
async function submit(){if(state.busy)return;state.busy=true;const button=document.getElementById("send");button.disabled=true;button.textContent="Отправляем…";try{const formData=new FormData();formData.set("payload",JSON.stringify({name:state.name.trim(),answers:state.answers,submissionId:uuid()}));for(const key of Object.keys(state.photos)){formData.set(key,state.photos[key]);formData.set(key+"_preview",await preview(state.photos[key]))}const response=await fetch(API,{method:"POST",body:formData});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||"Не удалось отправить анкету. Попробуй ещё раз.");app.innerHTML='<main class="success"><h1>Анкета отправлена</h1><p>'+esc(DATA.closing)+'</p><p>Через несколько дней тренер свяжется с Вами лично с готовыми решениями</p></main>';window.scrollTo(0,0)}catch(error){showError(error.message||"Не удалось отправить анкету. Ответы остались на экране.");button.disabled=false;button.textContent="Отправить анкету →";state.busy=false}}
function render(){window.scrollTo(0,0);state.step<0?intro():form()}
render();
</script>
</body>
</html>
