function scoreSpheres(answers) {
 return GROUPS.slice(1).map(g=>{
  const qs=QUESTIONS.filter(q=>q.group===g.id);
  const measured=qs.filter(q=>q.options.some(o=>o.score!==null));
  const known=measured.map(q=>answerOption(answers,q.id)?.score).filter(v=>typeof v==='number');
  const score=known.length>=2 ? Math.round(known.reduce((s,v)=>s+v,0)/(known.length*2)*100)/10 : null;
  const status=score===null?'unknown':score>=7?'strong':score>=4?'mixed':'attention';
  const evidence=measured.filter(q=>typeof answerOption(answers,q.id)?.score==='number').map(q=>q.id);
  const description=score===null?'Пока мало ответов для оценки этой сферы. Это не низкий результат: здесь нужна дополнительная ясность.':evidence.map(id=>observations[id]?.[answers[id]]).filter(Boolean).join(' ');
  const good=evidence.filter(id=>answerOption(answers,id).score===2).map(id=>({text:observations[id]?.[answers[id]],evidence:[id]})).filter(x=>x.text);
  const attention=evidence.filter(id=>answerOption(answers,id).score<2).map(id=>({text:observations[id]?.[answers[id]],evidence:[id]})).filter(x=>x.text);
  return {...g,score,status,known:known.length,total:measured.length,evidence,description,good,attention};
 });
}

 <section class="overview"><div class="portrait-card"><span class="section-no">01 / ЧТО С ТОБОЙ СЕЙЧАС ПРОИСХОДИТ</span><h2>${escapeHTML(r.title)}</h2><div class="portrait-narrative">${r.narrative.map(p=>`<p>${escapeHTML(p)}</p>`).join('')}</div></div><div class="wheel-panel"><div class="panel-label"><span>КОЛЕСО БАЛАНСА</span><span>5 СФЕР</span></div>${radar(r.spheres.map(s=>s.score))}<div class="micro-label">Шкала 0–10 · выше — устойчивее по твоим ответам${r.unknown.length?'<br>«—» означает, что пока мало данных для оценки.':''}</div><div class="wheel-bottom">${icon('target')}<div><strong>Смотрим на всё вместе</strong><p>Баллы показывают, где уже всё неплохо, а где чаще всего возникают сложности.</p></div></div></div></section>
 <section class="chapter" id="spheres">${sectionHeader('02','Что происходит в пяти сферах')}<div class="sphere-list">${r.spheres.map(s=>`<details class="sphere-row" style="--status:${STATUS[s.status].color};--score:${(s.score||0)*10}%"><summary><span class="sphere-title">${icon(s.icon)}<span><strong>${s.title}</strong><small>${STATUS[s.status].name}</small></span></span><span class="sphere-bar"><i></i></span><span class="sphere-score">${s.score===null?'—':String(s.score).replace('.',',')}<small>${s.score===null?'':'/10'}</small></span>${icon('chevron','chevron')}</summary><div class="sphere-detail"><p class="sphere-interpretation">${escapeHTML(brief(s.summary))}</p><div class="sphere-columns"><div><h4>Что уже получается</h4><p>${escapeHTML(s.goodConclusion)}</p></div><div><h4>Что мешает</h4><p>${escapeHTML(s.attentionConclusion)}</p></div></div></div></details>`).join('')}</div><p class="method">Баллы — ориентир по самооценке. Они отражают устойчивость привычек и субъективное состояние, не сравнивают тебя с другими и не оценивают здоровье. Все сферы не обязаны быть на 10.</p>${r.restriction?'<div class="restriction"><strong>Важно учесть самочувствие</strong>Ты указываешь на ограничения по самочувствию. Перед тем как менять или усиливать тренировки, обсуди их с профильным специалистом.</div>':''}${r.caveats.map(c=>`<div class="caveat">${escapeHTML(c)}</div>`).join('')}</section>
 <section class="chapter">${sectionHeader('03',r.selected.length?'Что мешает сильнее всего':'Что важно сохранить','Не нужно менять всё сразу. Здесь собраны две-три вещи, с которых есть смысл начать.')}<div class="limitations ${r.selected.length<2?'single':r.selected.length===2?'two':''}">${limitations}</div></section>
 <section class="chapter">${sectionHeader('04','Почему одно тянет за собой другое',r.chains.length>1?'Первая связь задевает больше следующих действий.':'Здесь видно, что происходит сначала, а что — следом.')}<div class="causal-grid">${r.chains.length?r.chains.map((c,i)=>`<div class="chain-card"><span class="section-no">${i===0?'ОСНОВНАЯ СВЯЗКА':'ЕЩЁ ОДНА СВЯЗКА'}</span><h3>${escapeHTML(c.title)}</h3><div class="causal-track">${c.nodes.map((n,j)=>`${j?'<span class="causal-arrow" aria-hidden="true">↓</span>':''}<div class="causal-node"><span>0${j+1}</span><p>${escapeHTML(n.text)}</p></div>`).join('')}</div><p class="causal-explanation">${escapeHTML(c.explanation)}</p></div>`).join(''):`<div class="chain-card"><h3>${r.allStable?'Твой режим уже выдерживает обычную жизнь':'Нужно посмотреть на один конкретный сложный день'}</h3><p>${r.allStable?'Выбери одно улучшение под свою цель и сохрани работающую базу.':'Посмотри, что происходит перед сбоем и что выпадает первым.'}</p></div>`}</div><p class="hypothesis-note">${escapeHTML(brief(r.methodology))}</p></section>
 <section class="chapter">${sectionHeader('05','Что разбирать по порядку','Короткая последовательность без попытки изменить всё сразу.')}<div class="steps strategic-steps">${r.stages.map(([t,d],i)=>`<div class="step"><span class="step-index">${i+1}</span><div><h3>${escapeHTML(t)}</h3><p>${escapeHTML(brief(d))}</p></div></div>`).join('')}</div><div class="note-card"><p>Нужен режим, который выдерживает работу, семью, поездки и отдельные пропуски.</p></div></section>
 <section class="chapter">${sectionHeader('06','К чему ты можешь прийти',r.destination.title)}<p class="destination-intro">${escapeHTML(r.destination.text)}</p><div class="destination-grid">${r.pointB.map(x=>`<div class="destination-item"><span>${escapeHTML(x.title)}</span><p>${escapeHTML(x.text)}</p></div>`).join('')}</div><p class="method">Это направление, которое подходит твоему запросу. Конкретные действия и сроки зависят от твоей ситуации.</p></section>
 <section class="cta"><div><span class="section-no">07 / ЧТО ДАЛЬШЕ</span><h2>Теперь понятно,<br>куда смотреть.</h2><p>На персональном разборе можно проверить этот вывод и выбрать два-три действия под твою обычную неделю.</p><div class="cta-note">С чем ты придёшь на разбор: ${escapeHTML(r.telegramRequest)}</div></div><div><a class="primary cta-main-action" href="${consultationUrl}" target="_blank" rel="noopener noreferrer">ПОПАСТЬ НА РАЗБОР ${icon('arrow')}</a></div></section>
 <div class="export-only">Персональный разбор: ${CONFIG.consultationUrl}</div><div class="bottom-tools no-print"><button class="text-btn" data-action="print">${icon('print')}Сохранить карту</button>${isDemo||isShared?'<button class="text-btn" data-action="start">Пройти свой разбор →</button>':'<button class="text-btn" data-action="edit">Изменить ответы</button><button class="text-btn" data-action="reset">Пройти заново</button>'}</div><p class="pdf-hint no-print">Выбери «Сохранить как PDF» в открывшемся окне печати.</p></article>`);focusHeading();
}
function toast(message){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=message;document.body.appendChild(t);setTimeout(()=>t.remove(),4000);}
function download(){
 const clone=document.getElementById('report').cloneNode(true);clone.querySelectorAll('.no-print,button').forEach(e=>e.remove());clone.classList.remove('fade');clone.querySelectorAll('.sphere-row').forEach(e=>e.open=true);
 const css=document.getElementById('site-styles').textContent;
 const html=`<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${demo?'Пример — ':''}Моя персональная карта · Точка А</title><style>${css}</style></head><body><div class="container">${demo?'<p style="padding-top:24px;color:#f3ed55">Пример на условных ответах</p>':''}${clone.outerHTML}<footer class="footer"><span>Точка А · Персональная карта</span><span>Сохранено ${new Date().toLocaleDateString('ru-RU')}</span></footer></div></body></html>`;
 const blob=new Blob([html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=demo?'primer-karty-tochka-a.html':'moya-karta-tochka-a.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('Карта скачивается. Её можно открыть в браузере.');
}
let lastFocus=null;
function modal(title,body,actions){lastFocus=document.activeElement;document.getElementById('overlay').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">${title}</h2><p>${body}</p><div class="modal-actions">${actions}</div></section></div>`;document.querySelector('.modal button')?.focus();}
function closeModal(){document.getElementById('overlay').innerHTML='';lastFocus?.focus();}
function resetConfirm(){modal('Начать с чистого листа?','Текущие ответы и карта в этом браузере будут заменены. Если хочешь сохранить результат, сначала скачай карту.','<button class="secondary" data-action="close">Оставить ответы</button><button class="primary" data-action="confirm-reset">Начать заново</button>');}
app.addEventListener('click',event=>{const option=event.target.closest('[data-answer]');if(option){selectAnswer(option.dataset.answer);return;}const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;if(action==='home')home();else if(action==='start')start();else if(action==='next')next();else if(action==='finish'){if(isComplete(answers))void completeAudit();}else if(action==='back'){position=Math.max(0,position-1);quiz();}else if(action==='demo')showReport(demoAnswers('energy'),true);else if(action==='result'){beaconReport(answers);void persistReport(answers).catch(()=>{});showReport(answers);}else if(action==='download')download();else if(action==='print')window.print();else if(action==='edit'){demo=false;position=0;quiz();}else if(action==='reset')resetConfirm();else if(action==='confirm-reset'){answers={};position=0;completedAt=null;demo=false;save();startQuiz();}else if(action==='close')closeModal();});
app.addEventListener('submit',event=>{if(event.target.id!=='lead-form')return;event.preventDefault();submitLead(event.target);});
document.addEventListener('keydown',event=>{
 const dialog=document.querySelector('.modal');
 if(dialog){if(event.key==='Escape'){event.preventDefault();closeModal();return;}if(event.key==='Tab'){const buttons=[...dialog.querySelectorAll('button,a')];if(event.shiftKey&&document.activeElement===buttons[0]){event.preventDefault();buttons.at(-1).focus();}else if(!event.shiftKey&&document.activeElement===buttons.at(-1)){event.preventDefault();buttons[0].focus();}}return;}
 if(screen!=='quiz'||event.ctrlKey||event.metaKey||event.altKey||event.repeat)return;
 const q=QUESTIONS[position];
 if(/^[1-9]$/.test(event.key)){const o=q.options[Number(event.key)-1];if(o){event.preventDefault();selectAnswer(o.id);document.querySelector(`[data-answer="${o.id}"]`)?.focus();}}
 else if(event.key==='Enter'&&(!document.activeElement?.closest('button')||document.activeElement?.hasAttribute('data-answer'))){event.preventDefault();next();}
 else if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)&&document.activeElement?.hasAttribute('data-answer')){event.preventDefault();const current=q.options.findIndex(o=>o.id===answers[q.id]);const delta=['ArrowUp','ArrowLeft'].includes(event.key)?-1:1;const option=q.options[(current+delta+q.options.length)%q.options.length];selectAnswer(option.id);document.querySelector(`[data-answer="${option.id}"]`).focus();}
});
const initialParams=new URLSearchParams(location.search),initialReport=initialParams.get('report'),initialDemo=initialParams.get('demo');
if(initialReport)void loadSharedReport(initialReport);else if(initialDemo)showReport(demoAnswers(initialDemo),true);else home();

// Optional browser-native controls reuse the same validation, state and UI.
if(document.modelContext?.registerTool){
 const lifecycle=new AbortController();
 const tools=[
  {name:'read_audit_state',title:'Посмотреть состояние аудита',description:'Read the current screen, progress and current question. Does not change or submit answers.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute(){return {screen,demo,answered:Object.keys(answers).length,total:QUESTIONS.length,currentQuestion:screen==='quiz'?QUESTIONS[position]:null,complete:isComplete(answers)};}},
  {name:'answer_audit_questions',title:'Заполнить ответы аудита',description:'Set explicitly supplied question/option IDs in local browser storage and show the next unanswered question. Does not complete the audit or send data to Telegram.',inputSchema:{type:'object',properties:{answers:{type:'object',additionalProperties:{type:'string'}}},required:['answers'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||typeof input!=='object'||!input.answers||typeof input.answers!=='object'||Array.isArray(input.answers))throw new Error('Provide an answers object.');const entries=Object.entries(input.answers);if(!entries.length||entries.some(([id,value])=>!QUESTIONS.find(q=>q.id===id)?.options.some(o=>o.id===value)))throw new Error('Unknown question or answer. No answers were changed.');answers={...answers,...input.answers};completedAt=null;demo=false;const missing=QUESTIONS.findIndex(q=>!answers[q.id]);position=missing<0?QUESTIONS.length-1:missing;save();quiz();return {answered:Object.keys(answers).length,total:QUESTIONS.length,readyToComplete:isComplete(answers)};}},
  {name:'complete_audit',title:'Сформировать персональную карту',description:'Complete the audit using all existing answers and display the personal result.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false},async execute(){if(!isComplete(answers))throw new Error('Answer all questions first.');await completeAudit();return {screen:'result',title:report.title,spheres:report.spheres.map(({id,score,status})=>({id,score,status}))};}}
 ];
 for(const tool of tools){try{Promise.resolve(document.modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});}catch{}}
 window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});
}
</script></body></html>
